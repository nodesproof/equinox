name: ci
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: selftest emulasi WAD
        run: python3 tools/reference/wad_emul.py
      - name: konstanta & vektor yang di-commit harus identik dengan generator
        run: |
          python3 tools/reference/gen_constants.py /tmp/c.rs /tmp/c.sol
          diff /tmp/c.rs stylus/bs-math/src/constants.rs && diff /tmp/c.sol contracts/src/math/BsConstants.sol
          python3 tools/reference/gen_vectors.py /tmp/v.rs /tmp/v.sol
          diff /tmp/v.rs stylus/bs-math/tests/common/vectors_gen.rs && diff /tmp/v.sol contracts/test/VectorsGen.sol
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: bs-math L1
        run: cd stylus/bs-math && cargo test
      - name: bs-stylus wasm build
        run: cd stylus/bs-stylus && cargo build --release --target wasm32-unknown-unknown
      - name: cargo stylus check (Sepolia publik)
        run: |
          cargo install cargo-stylus --version 0.10.9 --locked
          cd stylus/bs-stylus && cargo stylus check --endpoint https://sepolia-rollup.arbitrum.io/rpc
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }   # skrip mem-parsing receipt `cast`; pin agar formatnya stabil
      - name: L3 kontrol Solidity
        run: |
          cd contracts
          test -d lib/forge-std || forge install foundry-rs/forge-std --no-git
          test -d lib/prb-math || forge install PaulRBerg/prb-math@v4.1.0 --no-git
          forge test
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ABI web harus identik dengan artefak Foundry
        run: cd web && node scripts/gen-abi.mjs && git diff --exit-code -- src/abi
      - name: batas ukuran kontrak (EIP-170, 24.576 B) — margin runtime harus positif
        run: |
          cd contracts
          forge build --sizes --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          bad = [(n, v["runtime_size"], v["runtime_margin"]) for n, v in d.items() if v["runtime_size"] > 24576 or v["runtime_margin"] < 0]
          print("checked", len(d), "contracts; over limit:", bad)
          sys.exit(1 if bad else 0)'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: equinox-dashboard/package-lock.json }
      - run: npm ci   # data layer: ../web/src di-alias sebagai @chain dan me-resolve viem dari web/node_modules
        working-directory: web
      - run: npm ci
        working-directory: equinox-dashboard
      - run: npm run check && npm test && npm run build   # build menjalankan scripts/size.mjs (batas 250 KB gzip JS)
        working-directory: equinox-dashboard
